<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlantic Truck — Site Diagnostic</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { --pass:#16a34a; --fail:#dc2626; --warn:#d97706; --info:#2563eb; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; font-size: 14px; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .meta { color: #64748b; font-size: .85rem; margin-bottom: 20px; }
    .category { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .cat-header { background: #f1f5f9; padding: 10px 16px; font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: #475569; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .check { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #f1f5f9; }
    .check:last-child { border-bottom: none; }
    .badge { font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; margin-top: 2px; }
    .pass { background: #dcfce7; color: var(--pass); }
    .fail { background: #fee2e2; color: var(--fail); }
    .warn { background: #fef3c7; color: var(--warn); }
    .info { background: #dbeafe; color: var(--info); }
    .running { background: #f1f5f9; color: #64748b; }
    .label { font-weight: 600; }
    .detail { color: #64748b; font-size: .82rem; margin-top: 2px; word-break: break-all; }
    .summary { display: flex; gap: 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .sum-item { text-align: center; }
    .sum-num { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .sum-label { font-size: .72rem; color: #64748b; text-transform: uppercase; letter-spacing: .06em; }
    .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { padding: 8px 16px; border-radius: 6px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-size: .85rem; font-weight: 600; transition: background .15s; }
    button:hover { background: #f1f5f9; }
    button.primary { background: #B9111B; color: #fff; border-color: #B9111B; }
    button.primary:hover { background: #8E0E15; }
    .timing { font-size: .75rem; color: #94a3b8; margin-left: 4px; }
    .progress { height: 4px; background: #e2e8f0; border-radius: 2px; margin-bottom: 20px; }
    .progress-bar { height: 100%; background: #B9111B; border-radius: 2px; transition: width .3s; width: 0%; }
    pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; font-size: .75rem; overflow-x: auto; margin: 4px 0 0; }
  </style>
</head>
<body>
<h1>🔧 Atlantic Truck — Site Diagnostic</h1>
<div class="meta" id="timestamp">Running checks...</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<div class="summary" id="summary">
  <div class="sum-item"><div class="sum-num" id="sum-pass" style="color:var(--pass)">–</div><div class="sum-label">Pass</div></div>
  <div class="sum-item"><div class="sum-num" id="sum-fail" style="color:var(--fail)">–</div><div class="sum-label">Fail</div></div>
  <div class="sum-item"><div class="sum-num" id="sum-warn" style="color:var(--warn)">–</div><div class="sum-label">Warn</div></div>
  <div class="sum-item"><div class="sum-num" id="sum-total" style="color:#475569">–</div><div class="sum-label">Total</div></div>
</div>

<div class="actions">
  <button class="primary" onclick="runAll()">▶ Run All Checks</button>
  <button onclick="copyReport()">📋 Copy Report</button>
</div>

<div id="results"></div>

<script>
const BASE = '';
let passed = 0, failed = 0, warned = 0, total = 0;
const results = [];

function t(){ return Date.now(); }
async function get(url, opts={}){
  const t0=Date.now();
  try{
    const r = await fetch(url, {cache:'no-store', signal: AbortSignal.timeout(12000), ...opts});
    const ms = Date.now()-t0;
    let body='';
    try{ body=await r.text(); }catch(_){}
    return {ok:r.ok, status:r.status, body, ms, headers:r.headers};
  }catch(e){
    return {ok:false, status:0, body:'', ms:Date.now()-t0, error:String(e)};
  }
}
async function getJSON(url){
  const r=await get(url);
  try{ r.json=JSON.parse(r.body); }catch(_){ r.json=null; }
  return r;
}

function addCategory(id, title){ 
  const div=document.createElement('div');
  div.className='category'; div.id='cat-'+id;
  div.innerHTML=`<div class="cat-header">${title}<span id="cat-score-${id}" style="font-weight:400;font-size:.75rem"></span></div>`;
  document.getElementById('results').appendChild(div);
}
function addCheck(catId, label, status, detail='', timing=null){
  const cat=document.getElementById('cat-'+catId);
  if(!cat) return;
  const timingHtml=timing?`<span class="timing">${timing}ms</span>`:'';
  const detailHtml=detail?`<div class="detail">${detail}</div>`:'';
  const div=document.createElement('div');
  div.className='check';
  div.innerHTML=`<span class="badge ${status}">${status.toUpperCase()}</span><div><div class="label">${label}${timingHtml}</div>${detailHtml}</div>`;
  cat.appendChild(div);
  results.push({label, status, detail});
  if(status==='pass') passed++;
  else if(status==='fail') failed++;
  else if(status==='warn') warned++;
  total++;
  updateSummary();
}
function updateSummary(){
  document.getElementById('sum-pass').textContent=passed;
  document.getElementById('sum-fail').textContent=failed;
  document.getElementById('sum-warn').textContent=warned;
  document.getElementById('sum-total').textContent=total;
}
function setProgress(pct){ document.getElementById('progressBar').style.width=pct+'%'; }

async function runAll(){
  passed=0; failed=0; warned=0; total=0; results.length=0;
  document.getElementById('results').innerHTML='';
  document.getElementById('timestamp').textContent=`Started: ${new Date().toISOString()}`;
  setProgress(0);

  // ── CATEGORY 1: Netlify Functions ──────────────────────────────
  addCategory('functions','Netlify Functions');
  
  // health.js
  const health=await getJSON('/.netlify/functions/health');
  addCheck('functions','health.js — Netlify alive',
    health.ok && health.json?'pass':'fail',
    health.ok?`✓ Functions reachable`:`HTTP ${health.status} · ${health.error||''}`, health.ms);

  // news.js
  const news=await getJSON('/.netlify/functions/news?limit=30');
  const newsItems=news.json?.items||[];
  const sources=[...new Set(newsItems.map(i=>i.source))].slice(0,6).join(', ');
  addCheck('functions','news.js — RSS feed aggregation',
    news.ok && newsItems.length>0?'pass':'fail',
    news.ok?`✓ ${newsItems.length} articles · sources: ${sources}`:`HTTP ${news.status}`, news.ms);

  // news-image.js
  const testUrl='https://www.trucknews.com/';
  const nimg=await getJSON(`/.netlify/functions/news-image?u=${encodeURIComponent(testUrl)}`);
  addCheck('functions','news-image.js — Article image scraper',
    nimg.ok?'pass':'fail',
    nimg.ok?`✓ image=${nimg.json?.image?'found':'empty'} logo=${nimg.json?.logo?'found':'empty'}`:`HTTP ${nimg.status}`, nimg.ms);

  // get-facebook-posts.js
  const fbp=await getJSON('/.netlify/functions/get-facebook-posts?limit=3');
  const fbItems=fbp.json?.items||[];
  const fbWithImg=fbItems.filter(p=>p.image).length;
  addCheck('functions','get-facebook-posts.js — FB posts API',
    fbp.ok && fbItems.length>0?'pass': fbp.ok?'warn':'fail',
    fbp.ok?`✓ ${fbItems.length} posts · ${fbWithImg} with images`:`HTTP ${fbp.status} · ${fbp.json?.error||''}`, fbp.ms);

  // get-facebook-photos.js
  const fph=await getJSON('/.netlify/functions/get-facebook-photos?limit=3');
  const fphData=fph.json?.data||[];
  const fphWithSrc=fphData.filter(p=>p.images?.[0]?.source||p.source).length;
  addCheck('functions','get-facebook-photos.js — FB photos API',
    fph.ok && fphData.length>0?'pass':fph.ok?'warn':'fail',
    fph.ok?`✓ ${fphData.length} photos · ${fphWithSrc} with source URLs`:`HTTP ${fph.status} · ${fph.json?.error||''}`, fph.ms);

  // fb-img-proxy.js
  const proxyTest=await get('/.netlify/functions/fb-img-proxy?u=https%3A%2F%2Fwww.google.com%2F');
  addCheck('functions','fb-img-proxy.js — Image proxy function',
    proxyTest.status===403?'pass':proxyTest.status===502||proxyTest.status===0?'warn':'pass',
    proxyTest.status===403?'✓ Proxy running (correctly blocked non-FB domain)':`HTTP ${proxyTest.status}`, proxyTest.ms);

  // traffic.js
  const traf=await getJSON('/.netlify/functions/traffic');
  const trafAdv=traf.json?.advisories||[];
  addCheck('functions','traffic.js — NS traffic advisories',
    traf.ok && trafAdv.length>0?'pass':traf.ok?'warn':'fail',
    traf.ok?`✓ ${trafAdv.length} advisories`:`HTTP ${traf.status}`, traf.ms);
  setProgress(20);

  // ── CATEGORY 2: Environment Variables ──────────────────────────
  addCategory('env','Environment Variables');
  const envCheck=await getJSON('/.netlify/functions/health');
  const env=envCheck.json?.env||{};
  addCheck('env','FB_ACCESS_TOKEN set', env.FB_ACCESS_TOKEN?'pass':'fail',
    env.FB_ACCESS_TOKEN?'✓ FB_ACCESS_TOKEN is set':'✗ Missing — set in Netlify environment variables');
  addCheck('env','FB_PAGE_ID set', env.FB_PAGE_ID?'pass':'fail',
    env.FB_PAGE_ID?'✓ FB_PAGE_ID is set':'✗ Missing — set in Netlify environment variables');
  setProgress(30);

  // ── CATEGORY 3: PWA & Technical ────────────────────────────────
  addCategory('pwa','PWA & Technical');
  
  // SW
  let swOk=false;
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration('/');
      swOk=!!reg;
    }
  }catch(_){}
  addCheck('pwa','Service worker registered', swOk?'pass':'warn', swOk?'✓ SW active · scope: https://www.atlantictruck.ca/':'No SW registration found');

  // Manifest
  const mf=await getJSON('/manifest.json');
  addCheck('pwa','PWA manifest reachable',
    mf.ok && mf.json?.name?'pass':'fail',
    mf.ok?`✓ "${mf.json?.name}" · theme: ${mf.json?.theme_color} · icons: ${mf.json?.icons?.length||0}`:`HTTP ${mf.status}`, mf.ms);

  // Sitemap
  const sm=await get('/sitemap.xml');
  const smUrls=(sm.body.match(/<loc>/g)||[]).length;
  addCheck('pwa','sitemap.xml reachable', sm.ok && smUrls>0?'pass':'fail',
    sm.ok?`✓ ${smUrls} URLs in sitemap`:`HTTP ${sm.status}`, sm.ms);

  // Robots
  const rb=await get('/robots.txt');
  const rbLines=rb.body.trim().split('\n').filter(l=>l.trim()).length;
  addCheck('pwa','robots.txt reachable', rb.ok?'pass':'fail',
    rb.ok?`✓ ${rbLines} lines`:`HTTP ${rb.status}`, rb.ms);

  // Theme color
  const tcMeta=document.querySelector('meta[name="theme-color"]');
  addCheck('pwa','theme-color meta present', tcMeta?'pass':'warn',
    tcMeta?'Not on diagnostic page — check main pages':'Missing theme-color meta tag');
  setProgress(45);

  // ── CATEGORY 4: Core Pages ──────────────────────────────────────
  addCategory('pages','Core Pages');
  
  const pages=[
    ['/',                     'Homepage'],
    ['/news.html',            'News page'],
    ['/gallery.html',         'Gallery page'],
    ['/about.html',           'About page'],
    ['/contact.html',         'Contact page'],
    ['/requests.html',        'Book Service page'],
    ['/service-area.html',    'Service Area page'],
    ['/fleet-accounts.html',  'Fleet Accounts page'],
    ['/traffic.html',         'Traffic page'],
    ['/services/index.html',  'Services index'],
    ['/services/emergency-towing.html','Emergency Towing page'],
    ['/services/repair.html', 'Repair page'],
    ['/services/inspection.html','Inspection page'],
    ['/services/towing.html', 'Towing page'],
    ['/services/welding.html','Welding page'],
    ['/services/authorized-parts.html','Authorized Parts page'],
    ['/404.html',             '404 page'],
  ];
  
  for(const [url,label] of pages){
    const r=await get(url);
    const hasNav=r.body.includes('navToggle');
    const hasAction=r.body.includes('action-bar');
    const hasSkip=r.body.includes('skip-link');
    const hasSiteJs=r.body.includes('site.js');
    const issues=[];
    if(!hasNav) issues.push('missing navToggle');
    if(!hasAction) issues.push('missing action-bar');
    if(!hasSkip) issues.push('missing skip-link');
    if(!hasSiteJs) issues.push('missing site.js');
    const ok=r.ok && issues.length===0;
    addCheck('pages',label,
      ok?'pass':r.ok?'warn':'fail',
      r.ok?(issues.length?`⚠ ${issues.join(', ')}·${r.ms}ms`:`✓ ${r.ms}ms · nav ✓ action-bar ✓ skip ✓ js ✓`):`HTTP ${r.status}`, r.ms);
  }
  setProgress(70);

  // ── CATEGORY 5: Assets ─────────────────────────────────────────
  addCategory('assets','Critical Assets');
  
  const assets=[
    ['/assets/css/style.css',         'style.css', (r)=>{
      const lines=(r.body.match(/\n/g)||[]).length;
      const hasNav=r.body.includes('nav-drawer-header');
      const hasStatFix=r.body.includes('stat-num { color: #fff');
      const issues=[];
      if(!hasNav) issues.push('missing drawer CSS');
      if(!hasStatFix) issues.push('missing stat-num white fix');
      return {ok:r.ok&&issues.length===0, detail:r.ok?`✓ ${lines} lines${issues.length?' · ⚠ '+issues.join(', '):' · drawer ✓ stat-fix ✓'}`:`HTTP ${r.status}`};
    }],
    ['/assets/js/site.js',            'site.js', (r)=>{
      const hasMobileNav=r.body.includes('initMobileNav');
      const hasScraper=r.body.includes('scrapeNewsImages');
      const hasProxy=r.body.includes('fb-img-proxy');
      const fns=['initMobileNav','scrapeNewsImages','fb-img-proxy','renderGallery','initLightbox'];
      const missing=fns.filter(fn=>!r.body.includes(fn));
      return {ok:r.ok&&missing.length===0, detail:r.ok?(missing.length?`⚠ missing: ${missing.join(', ')}`:`✓ ${fns.length}/5 key functions present`):`HTTP ${r.status}`};
    }],
    ['/assets/img/logo.png',          'logo.png', (r)=>({ok:r.ok,detail:r.ok?`✓ ${Math.round(r.body.length/1024)}KB · ${r.ms}ms`:`HTTP ${r.status}`})],
    ['/assets/img/hero-rotator.webp', 'hero-rotator.webp', (r)=>({ok:r.ok,detail:r.ok?`✓ ${Math.round(r.body.length/1024)}KB`:`HTTP ${r.status}`})],
    ['/assets/img/hero-wrecker.webp', 'hero-wrecker.webp', (r)=>({ok:r.ok,detail:r.ok?`✓ loaded`:`HTTP ${r.status}`})],
    ['/manifest.json',                'manifest.json', (r)=>({ok:r.ok,detail:r.ok?`✓ valid JSON`:`HTTP ${r.status}`})],
    ['/sw.js',                        'sw.js', (r)=>({ok:r.ok,detail:r.ok?`✓ service worker present`:`HTTP ${r.status}`})],
  ];

  for(const [url,label,check] of assets){
    const r=await get(url);
    const result=check(r);
    addCheck('assets',label, result.ok?'pass':'fail', result.detail, r.ms);
  }
  setProgress(80);

  // ── CATEGORY 6: SEO & Content ──────────────────────────────────
  addCategory('seo','SEO & Content');

  const hp=await get('/');
  // Homepage checks
  addCheck('seo','Homepage — stat bar present', hp.body.includes('stat-bar')?'pass':'fail',
    hp.body.includes('stat-bar')?'✓ Stat bar HTML present':'Missing .stat-bar element');
  addCheck('seo','Homepage — OG image absolute URL', hp.body.includes('og:image" content="https://')?'pass':'warn',
    hp.body.includes('og:image" content="https://')?'✓ Absolute OG image URL':'Relative OG image URL found');
  addCheck('seo','Homepage — Schema.org JSON-LD', hp.body.includes('application/ld+json')?'pass':'warn',
    hp.body.includes('application/ld+json')?'✓ Structured data present':'Missing JSON-LD schema');
  addCheck('seo','Homepage — Canonical tag', hp.body.includes('rel="canonical"')?'pass':'warn',
    hp.body.includes('rel="canonical"')?'✓ Canonical present':'Missing canonical tag');
  addCheck('seo','Homepage — No banned names (Irving)', !hp.body.toLowerCase().includes('irving')?'pass':'fail',
    !hp.body.toLowerCase().includes('irving')?'✓ No banned names found':'⚠ Found banned name: Irving');
  addCheck('seo','Homepage — No "authorized dealer" language', !hp.body.toLowerCase().includes('authorized dealer')?'pass':'fail',
    !hp.body.toLowerCase().includes('authorized dealer')?'✓ No banned language':'⚠ Found "authorized dealer"');
  addCheck('seo','Homepage — theme-color meta', hp.body.includes('#B9111B')?'pass':'warn',
    hp.body.includes('#B9111B')?'✓ Brand red theme-color set':'Missing brand theme-color');
  addCheck('seo','Homepage — Google Analytics placeholder', !hp.body.includes('G-XXXXXXXXXX')?'pass':'warn',
    !hp.body.includes('G-XXXXXXXXXX')?'✓ GA4 configured':'⚠ Replace G-XXXXXXXXXX with real GA4 ID');
  
  // About page - staff check
  const about=await get('/about.html');
  const staffCards=(about.body.match(/staff-card/g)||[]).length;
  addCheck('seo','About — staff cards count', staffCards>=11?'pass':'warn',
    `${staffCards} staff cards found (expect 11)`);
  addCheck('seo','About — no Donald Shaw', !about.body.toLowerCase().includes('donald shaw')&&!about.body.toLowerCase().includes('donnie')?'pass':'fail',
    !about.body.toLowerCase().includes('donald')?'✓ Banned name not found':'⚠ Found "Donald" on About page');

  // Inspection page - no van/B-620 van
  const insp=await get('/services/inspection.html');
  addCheck('seo','Inspection — no B-620 van claims', !insp.body.toLowerCase().includes('b-620 van')?'pass':'fail',
    !insp.body.toLowerCase().includes('b-620 van')?'✓ No banned B-620 van reference':'⚠ Found banned "B-620 van"');
  setProgress(90);

  // ── CATEGORY 7: Forms ──────────────────────────────────────────
  addCategory('forms','Forms & Booking');
  
  const req=await get('/requests.html');
  addCheck('forms','Book Service — both forms present',
    req.body.includes('service@atlantictruck.ca') && req.body.includes('parts@atlantictruck.ca')?'pass':'fail',
    req.body.includes('service@atlantictruck.ca')?'✓ Both forms using FormSubmit.co':'⚠ Missing form');
  addCheck('forms','Book Service — honeypot present',
    req.body.includes('_honey')?'pass':'warn',
    req.body.includes('_honey')?'✓ Spam honeypot in both forms':'⚠ Missing honeypot field');
  addCheck('forms','Book Service — success redirect',
    req.body.includes('success.html')?'pass':'warn',
    req.body.includes('success.html')?'✓ Redirects to success page':'⚠ Missing _next redirect');

  // ── CATEGORY 8: Contact & Maps ─────────────────────────────────
  addCategory('maps','Contact & Maps');
  
  const contact=await get('/contact.html');
  addCheck('maps','Contact — Google Maps embed', contact.body.includes('maps/embed')?'pass':'fail',
    contact.body.includes('maps/embed')?'✓ Google Maps iframe present':'⚠ Missing map embed');
  addCheck('maps','Contact — Place ID correct',
    contact.body.includes('0x4b67fb01bb72039d')?'pass':'fail',
    contact.body.includes('0x4b67fb01bb72039d')?'✓ Correct Google Place ID':'⚠ Wrong or missing Place ID');
  
  const sa=await get('/service-area.html');
  addCheck('maps','Service Area — map not lazy loaded',
    sa.body.includes('maps/embed') && !sa.body.match(/maps\/embed[^>]*loading="lazy"/)?'pass':'warn',
    !sa.body.match(/maps\/embed[^>]*loading="lazy"/)?'✓ Map loads eagerly (no lazy)':'⚠ Map has lazy loading');
  setProgress(100);

  // Final timestamp
  document.getElementById('timestamp').textContent=`Completed: ${new Date().toISOString()} · ${total} checks`;
}

function copyReport(){
  const lines=[`Atlantic Truck Diagnostic Report`,`${new Date().toISOString()}`,''];
  results.forEach(r=>{
    const icon=r.status==='pass'?'[PASS   ]':r.status==='fail'?'[FAIL   ]':'[WARN   ]';
    lines.push(`${icon} ${r.label}${r.detail?' — '+r.detail.replace(/<[^>]*>/g,''):''}`);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('Report copied to clipboard!'));
}

// Auto-run on load
window.addEventListener('load', runAll);
</script>
</body>
</html>
